name: "dashboardtaxi"
description: "A Flutter Clean Architecture project."
publish_to: "none"
version: 1.2.8+10

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # UI / Design system
  animations: ^2.1.1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  device_preview_plus: ^2.6.1
  flutter_animate: ^4.5.2
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.0.0
  shimmer: ^3.0.0
  vector_graphics: ^1.1.19

  # State management / DI / Routing
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  go_router: ^17.0.0
  injectable: ^3.0.0

  # Networking / Session
  dio: ^5.9.0
  dio_refresh_bot: ^2.2.1
  flutter_secure_storage: ^10.0.0
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.5.3

  # Localization / Intl
  easy_localization: ^3.0.8
  flutter_timezone: ^5.0.1
  intl: ^0.20.2
  intl_phone_number_input: ^0.7.5

  # Forms
  reactive_forms: ^18.2.0

  # Device / Permissions
  device_info_plus: ^13.0.0
  permission_handler: ^12.0.1
  unique_identifier: ^0.4.0
  vibration: ^3.1.5

  # Firebase
  firebase_auth: ^6.1.1
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1

  # Notifications & Timing
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  # Local Storage
  objectbox: ^5.2.0
  objectbox_flutter_libs: ^5.2.0
  path_provider: ^2.1.5

  # UI Components & Input
  font_awesome_flutter: ^11.0.0
  freezed_annotation: ^3.1.0
  pinput: ^6.0.2

  # Maps & Location
  flutter_polyline_points: ^3.1.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.10.0
  image_picker: ^1.2.2
  signalr_netcore: ^1.4.4
  url_launcher: ^6.3.2

  # Audio playback (admin plays in-trip safety recordings in-app)
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.10.4
  flutter_gen_runner: ^5.12.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_flavorizr: ^2.4.1
  freezed: ^3.2.3
  injectable_generator: ^3.0.0
  objectbox_generator: ^5.2.0
  vector_graphics_compiler: ^1.1.19

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
    - assets/images/
    - path: assets/svgIcons/
      transformers:
        - package: vector_graphics_compiler

flutter_gen:
  output: lib/utils/gen/

# dart run flutter_flavorizr
flavorizr:
  flavors:
    stage:
      app:
        name: "dashboardtaxi Stage"
        package_name: "dev.fat7i.dashboardtaxi"
      android:
        applicationId: "dev.fat7i.dashboardtaxi"
    production:
      app:
        name: "dashboardtaxi"
        package_name: "dev.fat7i.dashboardtaxi"
      android:
        applicationId: "dev.fat7i.dashboardtaxi"
  instructions:
    - android:androidManifest
    - android:flavorizrGradle
    - android:buildGradle
    - flutter:flavors
    - ide:config
